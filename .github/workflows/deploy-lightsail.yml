name: Deploy to Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lightsail-production
  cancel-in-progress: true

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pagebuilder
          POSTGRES_USER: pagebuilder
          POSTGRES_PASSWORD: pagebuilder
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pagebuilder:pagebuilder@localhost:5432/pagebuilder?schema=public
      SESSION_SECRET: github-actions-build-secret-only
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-me-now
      NEXT_PUBLIC_CAROUSEL_IMAGES: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database schema
        run: npm run db:push

      - name: Seed build database
        run: npm run db:seed

      - name: Build
        run: npm run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.LIGHTSAIL_APP_DIR }}"
            git pull --ff-only origin main
            npm ci
            npm run db:push
            npm run build
            pm2 restart "${{ secrets.LIGHTSAIL_PM2_APP_NAME }}"
