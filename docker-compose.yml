services:
  postgres:
    image: postgres:16-alpine
    container_name: pagebuilder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pagebuilder
      POSTGRES_USER: pagebuilder
      POSTGRES_PASSWORD: pagebuilder
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
